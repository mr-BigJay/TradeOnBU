name: tradeonbu-telegram-reader
services:
  reader:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - reader_state:/state
      - signal_inbox:/export
    environment:
      PAPER_EXPORT: "${PAPER_EXPORT:-0}"
      CHANNEL_PEER: "-1878414449"
      CHANNEL_TITLE: "BehDark (VIP)"
    shm_size: 256m
    mem_limit: 1536m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "/reader/reader.py", "health"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
volumes:
  reader_state:
  signal_inbox:
    name: tradeonbu_telegram_inbox
