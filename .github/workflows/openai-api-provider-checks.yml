name: OpenAI API Provider Regression

on:
  pull_request:
    paths:
      - "backend/app/config.py"
      - "backend/app/routes/chatgpt_ai.py"
      - "backend/app/services/ai_analysis_scheduler.py"
      - "backend/app/services/ai_ict_analysis.py"
      - "backend/app/services/openai_api_models.py"
      - "backend/tests/test_openai_api_provider.py"
      - "frontend/src/ChatGptSettingsPage.tsx"
      - ".github/workflows/openai-api-provider-checks.yml"
  push:
    branches:
      - feat/openai-api-provider-luna-high
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Prepare isolated database
        run: mkdir -p data
      - name: Test all backend
        env:
          SKIP_CONFIG_GUARD: "1"
          DISABLE_APP_BACKGROUND: "1"
          DATABASE_URL: sqlite+aiosqlite:///./data/test_tradeonbu.db
        run: python3 -m pytest -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: UI tests
        run: npm test
