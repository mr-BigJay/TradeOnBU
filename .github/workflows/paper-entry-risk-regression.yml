name: Paper Entry Risk Regression

on:
  pull_request:
    paths:
      - 'backend/app/services/execution_model.py'
      - 'backend/app/services/execution_model_sim.py'
      - 'backend/app/services/position/calculations.py'
      - 'backend/app/services/position/position_service.py'
      - 'backend/tests/test_effective_execution_rr.py'
      - '.github/workflows/paper-entry-risk-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  risk:
    name: Executable R:R and paper position regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: mkdir -p data
      - name: Execute trading risk regressions
        run: |
          python3 -m pytest -q \
            tests/test_effective_execution_rr.py \
            tests/test_execution_model_sim.py \
            tests/test_execution_tp_cap.py \
            tests/test_paper_execution.py \
            tests/test_paper_auto_trading.py \
            tests/test_position_management.py
