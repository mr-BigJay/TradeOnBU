name: Execution TP Cap Backend Regression

on:
  push:
    branches:
      - cursor/execution-tp-max-rr-2ec7
  pull_request:
    paths:
      - "backend/app/domain/execution_tp_cap.py"
      - "backend/app/services/execution_tp_cap_apply.py"
      - "backend/app/services/position/position_service.py"
      - "backend/app/services/paper_auto_trading.py"
      - "backend/tests/test_execution_tp_cap.py"
      - ".github/workflows/execution-tp-cap-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Full backend regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Prepare test data directory
        run: mkdir -p data
      - name: Full backend regression
        run: python3 -m pytest -q
