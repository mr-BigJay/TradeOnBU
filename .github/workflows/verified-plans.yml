name: Verified paper trade plans
on:
  pull_request:
  push:
    branches: [main]
jobs:
  container-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tradeonbu-import-check .
      - run: docker run --rm --network none -e DISABLE_APP_BACKGROUND=1 -e VERIFIED_PLANS_ENABLED=1 tradeonbu-import-check python -c 'from app.main import app; from app.services.verified_trade_plan import enabled; assert enabled(); print("VERIFIED_IMPORT_OK")'
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: mkdir -p data
      - run: PYTHONPATH=backend pytest -q backend/tests/test_ai_market_intelligence.py backend/tests/test_outlook_telegram.py backend/tests/test_openai_api_provider.py backend/tests/test_poi_context.py backend/tests/test_outlook_four_hour.py backend/tests/test_daily_outlook.py backend/tests/test_carried_open.py backend/tests/test_market_data_pagination.py backend/tests/test_verified_trade_plan.py backend/tests/test_strict_a_execution_plan.py backend/tests/test_paper_auto_trading.py backend/tests/test_timely_entry_confirmations.py backend/tests/test_ai_first_revisions.py backend/tests/test_ai_schedule_60min.py
