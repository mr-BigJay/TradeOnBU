name: Backend Regression Baseline Alignment

on:
  pull_request:
    paths:
      - 'backend/tests/test_ai_first_final_pass.py'
      - 'backend/tests/test_ai_first_revisions.py'
      - 'backend/tests/test_ai_pipeline_regressions.py'
      - 'backend/tests/test_ai_setup_integrity.py'
      - '.github/workflows/backend-baseline-alignment.yml'

permissions:
  contents: read

jobs:
  backend:
    name: Full backend baseline test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: mkdir -p data
      - name: Run entire backend regression suite
        run: python -m pytest -q
