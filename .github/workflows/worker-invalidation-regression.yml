name: Worker Invalidation and Full Backend Regressions

on:
  pull_request:
    paths:
      - 'backend/tests/test_worker_5m_invalidation_before_1m_fill.py'
      - 'backend/app/worker.py'
      - 'backend/app/domain/execution_order_policy.py'
      - '.github/workflows/worker-invalidation-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Worker order chronology + full suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: mkdir -p data
      - name: Worker ordering regression
        run: python -m pytest -q tests/test_worker_5m_invalidation_before_1m_fill.py
      - name: Entire backend regression
        run: python -m pytest -q
