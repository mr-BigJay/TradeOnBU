name: Position UI Checks
on:
  push:
    branches:
      - feat/position-financial-ui
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/position-frontend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: Build frontend
        run: npm run build
      - name: React/Vitest tests
        run: npm test
