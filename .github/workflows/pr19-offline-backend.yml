name: PR19 Offline Backend Regression

on:
  push:
    branches:
      - cursor/forward-paper-e2e-2ec7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-backend:
    name: Full backend - Docker network none
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
      - name: Build isolated test image
        run: docker build --tag tradeonbu-tradeonbu:latest .
      - name: Run full backend regression without network or production mounts
        run: bash scripts/pr19-offline-regression.sh
